name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - refactor/**

jobs:
  web-app:
    name: Web App
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET_CI }}
      ML_SERVICE_BASE_URL: http://127.0.0.1:8000

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

