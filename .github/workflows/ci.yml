name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - refactor/**

jobs:
  web-app:
    name: Web App
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET_CI }}
      ML_SERVICE_BASE_URL: http://127.0.0.1:8000

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  db-setup-check:
    name: DB Migrate + Seed
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rental_mobil_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rental_mobil_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # One command: migrate + seed + verify, run twice on a clean database —
      # the second run proves every step is idempotent.
      - name: Setup database (migrate + seed + verify)
        run: npm run setup

      - name: Re-run setup (idempotency check)
        run: npm run setup

